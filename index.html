<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Urda Blichfeldt — Links</title>
<style>
  :root {
    --yellow: #F5DE3A;
    --ink: #1A1A1A;
    --shadow: #1A1A1A;
    --red: #F3564A;
    --teal: #34B8C4;
    --purple: #C86BF0;
    --orange: #F5A83C;
    --green: #34D67A;
    --tag: #C9B94A;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--yellow);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
  }
  body {
    display: flex;
    justify-content: center;
    min-height: 100vh;
    padding: 48px 20px 40px;
  }
  .page {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .avatar {
    width: 108px;
    height: 108px;
    border-radius: 50%;
    overflow: hidden;
    border: 3px solid var(--ink);
    background: #ddd;
    flex-shrink: 0;
  }
  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .name {
    margin: 16px 0 4px;
    font-size: 22px;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .badge {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }
  .bio {
    margin: 0 0 18px;
    font-size: 15px;
    font-weight: 600;
    text-align: center;
    color: #2b2b2b;
  }
  .socials {
    display: flex;
    gap: 22px;
    margin-bottom: 28px;
  }
  .socials a {
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .socials svg {
    width: 24px;
    height: 24px;
  }
  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .link-btn {
    position: relative;
    width: 100%;
    text-decoration: none;
    color: var(--ink);
  }
  .link-btn .face {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 18px 16px;
    border: 3px solid var(--ink);
    border-radius: 4px;
    font-weight: 800;
    font-size: 16px;
    background: var(--btn-color);
    position: relative;
    transform: translate(0, 0);
    transition: transform 0.08s ease;
    box-shadow: 6px 6px 0 var(--shadow);
  }
  .link-btn:active .face {
    transform: translate(3px, 3px);
    box-shadow: 3px 3px 0 var(--shadow);
  }
  .link-red   .face { --btn-color: var(--red); }
  .link-teal  .face { --btn-color: var(--teal); }
  .link-purple .face { --btn-color: var(--purple); }
  .link-orange .face { --btn-color: var(--orange); }
  .link-green .face { --btn-color: var(--green); }

  .footer {
    margin-top: 40px;
  }
  .footer .tag {
    display: inline-block;
    background: var(--tag);
    border: 2px solid var(--ink);
    border-radius: 4px;
    padding: 6px 14px;
    font-size: 11px;
    font-weight: 800;
    line-height: 1.1;
    text-align: center;
    color: #fff;
    letter-spacing: 0.5px;
  }

  @media (prefers-reduced-motion: reduce) {
    .link-btn .face { transition: none; }
  }
</style>
</head>
